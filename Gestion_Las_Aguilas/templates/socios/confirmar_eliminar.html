{% extends 'base.html' %}

{% block title %}Eliminar socio{% endblock %}

{% block content %}
<h1>Eliminar socio</h1>
<p>Confirma que deseas eliminar a {{ socio.nombre }} {{ socio.apellido }}.</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Eliminar</button>
    <a href="{% url 'lista_socios' %}">Cancelar</a>
</form>
{% endblock %}
