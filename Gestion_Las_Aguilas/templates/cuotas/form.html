{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 600px;">
    <h2>Registrar Pago de Cuota</h2>
    <form method="POST" class="card card-body shadow-sm mt-3">
        {% csrf_token %}

        <!-- Selección de Socio -->
        <div class="mb-3">
            <label class="form-label">Socio</label>
            <select name="socio" class="form-select" required>
                <option value="">-- Seleccionar Socio --</option>
                {% for socio in socios %}
                    <option value="{{ socio.id }}">{{ socio.apellido }}, {{ socio.nombre }} (DNI: {{ socio.DNI }})</option>
                {% endfor %}
            </select>
        </div>

        <!-- Período (Mes y Año) -->
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Mes</label>
                <select name="mes" class="form-select" required>
                    <option value="1">Enero</option>
                    <option value="2">Febrero</option>
                    <option value="3">Marzo</option>
                    <option value="4">Abril</option>
                    <option value="5">Mayo</option>
                    <option value="6">Junio</option>
                    <option value="7">Julio</option>
                    <option value="8">Agosto</option>
                    <option value="9">Septiembre</option>
                    <option value="10">Octubre</option>
                    <option value="11">Noviembre</option>
                    <option value="12">Diciembre</option>
                </select>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Año</label>
                <input type="number" name="anio" value="2026" class="form-control" required>
            </div>
        </div>

        <!-- Monto -->
        <div class="mb-3">
            <label class="form-label">Monto ($)</label>
            <input type="number" step="0.01" name="monto" class="form-control" placeholder="Ej: 5000" required>
        </div>

        <!-- Medio de Pago -->
        <div class="mb-3">
            <label class="form-label">Medio de Pago</label>
            <select name="medio_pago" class="form-select" required>
                <option value="EF">Efectivo</option>
                <option value="TR">Transferencia</option>
                <option value="MP">Mercado Pago</option>
            </select>
        </div>

        <!-- Botones de Acción -->
        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'lista_cuotas' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar Pago</button>
        </div>
    </form>
</div>
{% endblock %}
