{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h2>Cargar Nuevo Material</h2>
    <form method="POST" class="card card-body shadow-sm mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Nombre del Material</label>
            <input type="text" name="nombre" class="form-control" placeholder="Ej: Pelotas Gilbert N°5" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad Total</label>
            <input type="number" name="cantidad_total" class="form-control" min="1" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Estado de la Mercadería</label>
            <input type="text" name="estado" class="form-control" value="Buen estado" required>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'lista_inventario' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">Guardar</button>
        </div>
    </form>
</div>
{% endblock %}
