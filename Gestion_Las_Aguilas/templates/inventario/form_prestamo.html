{% extends 'base.html' %}

{% block content %}
<div class="container mt-4" style="max-width: 500px;">
    <h2>Registrar Préstamo de Material</h2>
    <form method="POST" class="card card-body shadow-sm mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Elemento a Prestar</label>
            <select name="material" class="form-select" required>
                <option value="">-- Seleccionar Material --</option>
                {% for m in materiales %}
                    <option value="{{ m.id }}">{{ m.nombre }} (Disponibles: {{ m.cantidad_disponible }})</option>
                {% endfor %}
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Responsable (Entrenador / Encargado)</label>
            <input type="text" name="responsable" class="form-control" placeholder="Ej: Profe Juan (M16)" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Cantidad</label>
            <input type="number" name="cantidad" class="form-control" min="1" value="1" required>
        </div>

        <div class="d-flex justify-content-between mt-3">
            <a href="{% url 'lista_inventario' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-warning">Confirmar Préstamo</button>
        </div>
    </form>
</div>
{% endblock %}
