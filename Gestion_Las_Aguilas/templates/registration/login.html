{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="card card-dark card-glow p-4 shadow-lg" style="width: 100%; max-width: 420px;">
        <div class="text-center mb-4">
            <span class="fs-1">🏉</span>
            <h3 class="fw-bold text-white mt-2">Acceso al Sistema</h3>
            <p class="text-secondary small">Club de Rugby Las Águilas</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger bg-danger bg-opacity-10 border-danger text-danger text-center small p-2 mb-3">
                Usuario o contraseña incorrectos.
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label text-light">Usuario</label>
                <input type="text" name="username" class="form-control form-control-dark" required autofocus>
            </div>

            <div class="mb-4">
                <label class="form-label text-light">Contraseña</label>
                <input type="password" name="password" class="form-control form-control-dark" required>
            </div>

            <button type="submit" class="btn btn-fucsia w-100 py-2">Ingresar</button>
        </form>
    </div>
</div>
{% endblock %}
